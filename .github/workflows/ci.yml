name: CI

# 设计原则：CI 只跑跨平台、无外部依赖的检查（analyze + 单测）；
# 重型作业（Android emulator E2E、APK release build）一律本地 `bash bin/test-all.sh` 跑。
# 这样 CI 永远 ~2 分钟结束，不被 emulator 冷启 / libcore.aar 二进制 缺失之类的问题拖累。

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ integration_test/
      - run: flutter analyze --fatal-warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/ --reporter expanded
