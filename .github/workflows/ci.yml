name: CI

# 设计原则：CI 跑跨平台、无外部依赖的检查（analyze + 单测 + Android release build）。
# Android emulator E2E 因为冷启 8-10min 不进 CI，仍靠本地 bin/test-all.sh 跑。

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ integration_test/
      - run: flutter analyze --fatal-warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/ --reporter expanded

  # Android Kotlin host JVM 单测：守 wire-format / LogBuffer / AIDL decode 这些
  # 纯逻辑。不需要 emulator，几秒就跑完。新增 Kotlin 代码必须有对应测试，否则
  # PR 进不了 main。
  test-android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: build/app/test-results/**/*.xml

  build-android:
    runs-on: ubuntu-latest
    needs: [analyze, test-unit, test-android-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: clashmiao-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # macOS debug build —— 跑在 macos-latest 上，验证 macOS 端 FFI / 桌面 UI
  # 不会因为 Android 这边改动回归（之前 macOS 烟雾测试在 luke 本地手跑过，CI 这边
  # 把"能编"的 gate 加进来）。
  build-macos:
    runs-on: macos-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --debug --no-tree-shake-icons

  # iOS debug build (simulator, unsigned) —— SingBoxPacketTunnel target 已注册进 pbxproj，
  # Libcore.xcframework 含 ios-arm64_x86_64-simulator slice。
  # 直接调用 xcodebuild 面向 iphonesimulator：规避 iphoneos domain 在无签名环境下
  # 无法解析 com.apple.product-type.app-extension.network-extension 的 CI 限制。
  # Flutter Run Script phases 会自动调用 flutter assemble 编译 Dart 代码。
  build-ios:
    runs-on: macos-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: pod install
        working-directory: ios
        run: pod install
      - name: xcodebuild iOS Simulator debug (no codesign)
        working-directory: ios
        run: |
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=YES

  # Windows debug build —— CMakeLists.txt 用 if(EXISTS) 检查 libcore.dll，
  # 缺文件时只是跳过 install 而不报错，编译本身可以通过。
  build-windows:
    runs-on: windows-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --debug

  # Linux debug build —— 同 Windows，libcore.so 缺时 CMake 跳过 install，编译通过。
  build-linux:
    runs-on: ubuntu-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --debug
