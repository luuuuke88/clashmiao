name: CI

# 设计原则：CI 跑跨平台、无外部依赖的检查（analyze + 单测 + 5 平台 build）。
# Android emulator E2E 因为冷启 8-10min 不进 CI，仍靠本地 bin/test-all.sh 跑。
#
# libcore 二进制走 GitHub Release tag (LIBCORE_TAG)，build job 用 gh release
# download 拉。**绝不 lfs: true** —— 仓库 LFS bandwidth 配额按月计，多 job 并行
# checkout 会瞬间吃光 1GB/月，导致整个 CI 死锁。

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.4'
  LIBCORE_TAG: libcore-v1.11.0
  LIBCORE_REPO: luke501/clashmiao

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ integration_test/
      - run: flutter analyze --fatal-warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/ --reporter expanded

  # Android Kotlin host JVM 单测：守 wire-format / LogBuffer / AIDL decode 这些
  # 纯逻辑。不需要 emulator，但 :app:compileDebugKotlin 引用 libcore.aar
  # 里的 OutboundGroup 等类，所以 aar 必须先拉下来。
  test-android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh android
      - run: flutter pub get
      - name: Gradle test (with 3x retry — google maven 偶发握手失败)
        working-directory: android
        run: |
          for i in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --console=plain --no-daemon; then
              exit 0
            fi
            echo "::warning::gradle attempt $i failed, retry in 15s..."
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: build/app/test-results/**/*.xml

  build-android:
    runs-on: ubuntu-latest
    needs: [analyze, test-unit, test-android-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh android
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: clashmiao-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    runs-on: macos-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh macos
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --debug --no-tree-shake-icons

  # iOS unsigned debug build —— SingBoxPacketTunnel target 在 pbxproj，
  # Libcore.xcframework 走 Release artifact 拉。pod install 识别两个 target。
  # productType 通用 com.apple.product-type.app-extension，--no-codesign 跳过签名。
  build-ios:
    runs-on: macos-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (ios xcframework)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh ios
      - run: flutter pub get
      - name: pod install
        working-directory: ios
        run: pod install
      - run: flutter build ios --debug --no-codesign --no-tree-shake-icons

  # Windows release build —— libcore.dll 拉 Release artifact，CMakeLists.txt
  # install 阶段拷到 .exe 同目录。grep 校验 libcore 真在 release output。
  build-windows:
    runs-on: windows-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bin/fetch-libcore.sh windows
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Verify libcore.dll bundled next to exe
        shell: pwsh
        run: |
          $bundled = "build/windows/x64/runner/Release/libcore.dll"
          if (!(Test-Path $bundled)) {
            Get-ChildItem -Recurse build/windows -Filter libcore.dll | ForEach-Object { Write-Host $_.FullName }
            Write-Error "libcore.dll not bundled into release output"
            exit 1
          }
          Write-Host "Verified: $bundled"
      - uses: actions/upload-artifact@v4
        with:
          name: clashmiao-windows-release
          path: build/windows/x64/runner/Release/

  # Linux release build —— libcore.so 拉 Release artifact，CMakeLists.txt install
  # 拷到 bundle/lib/，rpath $ORIGIN/lib 让 ELF 找到。nm 抽查 FFI 符号导出。
  build-linux:
    runs-on: ubuntu-latest
    needs: [analyze, test-unit]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh linux
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Verify libcore.so bundled into release output
        run: |
          bundled=build/linux/x64/release/bundle/lib/libcore.so
          if [ ! -f "$bundled" ]; then
            find build/linux -name libcore.so
            echo "libcore.so not bundled into release output"; exit 1
          fi
          nm -D --defined-only "$bundled" | grep -E ' T (setup|start|stop|parse|selectOutbound|urlTest)$' || {
            echo "libcore.so is missing expected FFI symbols"; exit 1
          }
          echo "Verified: $bundled with required FFI exports"
      - uses: actions/upload-artifact@v4
        with:
          name: clashmiao-linux-release
          path: build/linux/x64/release/bundle/

  # ============ 真流量 smoke 验证 ============
  # 每个 smoke job：build release → 启动 GUI app（DevBoot 自动加订阅 + 连接）→
  # 等 mixed inbound 127.0.0.1:2080 监听 → curl --proxy 拿出口 IP → 对比 baseline。
  # 没有 CLASHMIAO_TEST_SUB_URL secret 时整组跳过（fork PR 等场景）。

  smoke-macos:
    runs-on: macos-latest
    needs: [build-macos]
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh macos
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release --no-tree-shake-icons
      - name: Smoke (real proxy traffic)
        env:
          CLASHMIAO_TEST_SUB_URL: ${{ secrets.CLASHMIAO_TEST_SUB_URL }}
        run: |
          if [ -z "$CLASHMIAO_TEST_SUB_URL" ]; then
            echo "CLASHMIAO_TEST_SUB_URL secret unset, skipping smoke"
            exit 0
          fi
          bash bin/smoke-desktop.sh

  smoke-linux:
    runs-on: ubuntu-latest
    needs: [build-linux]
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev xvfb curl
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh linux
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - run: flutter build linux --release
      - name: Smoke (real proxy traffic)
        env:
          CLASHMIAO_TEST_SUB_URL: ${{ secrets.CLASHMIAO_TEST_SUB_URL }}
        run: |
          if [ -z "$CLASHMIAO_TEST_SUB_URL" ]; then
            echo "CLASHMIAO_TEST_SUB_URL secret unset, skipping smoke"
            exit 0
          fi
          bash bin/smoke-desktop.sh

  smoke-windows:
    runs-on: windows-latest
    needs: [build-windows]
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bin/fetch-libcore.sh windows
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Smoke (real proxy traffic)
        env:
          CLASHMIAO_TEST_SUB_URL: ${{ secrets.CLASHMIAO_TEST_SUB_URL }}
        shell: pwsh
        run: |
          if (-not $env:CLASHMIAO_TEST_SUB_URL) {
            Write-Host "CLASHMIAO_TEST_SUB_URL secret unset, skipping smoke"
            exit 0
          }
          .\bin\smoke-desktop.ps1

  # Android 真流量 e2e：reactivecircus/android-emulator-runner 起 KVM emulator
  # 跑 integration_test/android_smart_mode_test.dart，断言代理出口 IP ≠ baseline。
  # KVM 启动 emulator 大约 5-10min，整个 job 通常 15-20min。
  smoke-android:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh android
      - run: flutter pub get
      - name: Run integration_test on emulator
        env:
          CLASHMIAO_TEST_SUB_URL: ${{ secrets.CLASHMIAO_TEST_SUB_URL }}
        uses: reactivecircus/android-emulator-runner@v2
        if: ${{ env.CLASHMIAO_TEST_SUB_URL != '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            flutter build apk --debug
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.clashmiao.clashmiao android.permission.POST_NOTIFICATIONS || true
            adb shell cmd appops set com.clashmiao.clashmiao ESTABLISH_VPN_SERVICE allow || true
            bash bin/grant-vpn-android.sh &
            flutter test integration_test/android_smart_mode_test.dart -d emulator-5554 --dart-define=CLASHMIAO_TEST_SUB_URL="$CLASHMIAO_TEST_SUB_URL"
