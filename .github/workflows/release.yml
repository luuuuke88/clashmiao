name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.4'
  LIBCORE_TAG: libcore-v1.11.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh android
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh macos
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "ClashMiao" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build/clashmiao-macos.dmg" \
            "build/macos/Build/Products/Release/clashmiao.app" || \
          (echo "dmg creation failed (likely codesign); zip instead" && \
           cd build/macos/Build/Products/Release && \
           zip -r ../../../../clashmiao-macos.zip clashmiao.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/clashmiao-macos.dmg
            build/clashmiao-macos.zip
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bin/fetch-libcore.sh windows
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - run: flutter build windows --release
      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:CLASHMIAO_VERSION = "${{ github.ref_name }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\packaging\inno\clashmiao.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/installer/ClashMiao-Windows-x64-Setup.exe
            build/windows/x64/runner/Release/

  publish:
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ARTIFACTS=(artifacts/android/* artifacts/macos/* artifacts/windows/*)
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${ARTIFACTS[@]}"
