name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.27.0'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Create dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "ClashMiao" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "build/clashmiao-macos.dmg" \
            "build/macos/Build/Products/Release/clashmiao.app" || \
          (echo "dmg creation failed (likely codesign); zip instead" && \
           cd build/macos/Build/Products/Release && \
           zip -r ../../../../clashmiao-macos.zip clashmiao.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/clashmiao-macos.dmg
            build/clashmiao-macos.zip
          if-no-files-found: warn

  publish:
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ARTIFACTS=(artifacts/android/* artifacts/macos/*)
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${ARTIFACTS[@]}"
