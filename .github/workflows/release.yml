name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v0.1.0'
        required: true
        type: string
      draft:
        # 手动触发时默认发成 draft：draft release 只有协作者能看到、可以随时
        # 删除，用来**排练**整条发布流水线而不对外暴露任何东西。
        # 这条流水线的每一步单独验过，但从没端到端跑过一次真实发布——首次
        # 就直接对外发是拿用户当测试用例。tag push 触发时不受影响（下面的
        # 表达式在 tag 场景下取 false），正式发版行为不变。
        description: '发成 draft（只有协作者可见，可随时删除）——用来排练发布流程'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.2'
  LIBCORE_TAG: libcore-v1.11.0
  LIBCORE_REPO: luuuuke88/clashmiao
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  report-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release-status branch
        run: |
          git fetch origin release-status || true
          if git show-ref --verify --quiet refs/remotes/origin/release-status; then
            git checkout -B release-status origin/release-status
          else
            git checkout --orphan release-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
      - name: Write release start status
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = {
              "status": "started",
              "tag": os.environ["RELEASE_TAG"],
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "jobs": {},
              "artifacts": [],
          }

          out_dir = Path(".release-status")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / f"{os.environ['RELEASE_TAG']}.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Push release start status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".release-status/${RELEASE_TAG}.json"
          git commit -m "Record release start ${RELEASE_TAG}" || true
          git push origin release-status

  quality:
    runs-on: ubuntu-latest
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Derive version from tag
        id: version
        # 必须显式声明 bash：windows-latest 的默认 shell 是 pwsh，下面这段
        # 是 bash 语法（参数展开 ${VAR#v} / case / >> "$GITHUB_OUTPUT"），
        # 不声明的话 windows job 会用 pwsh 去跑它，第一次真正发版就炸。
        # actionlint 抓不到这个——它按 bash 校验脚本内容，不看 runner 默认 shell。
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3。flutter --build-name 只接受 x.y.z，带 v 前缀会被
          # 当成非法版本；tag 里可能有的 -beta 之类后缀也一并去掉。
          #
          # quality job 里也跑这一步（虽然它不用结果）：它是其它 job 的 needs，
          # tag 格式不对时在这里就 fail，而不是等三个 build job 并行跑到一半
          # 才各自炸一次。
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME%%-*}"
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$RELEASE_TAG' 推导不出合法版本号（需要 vX.Y.Z 形式）"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "推导版本: $NAME (build ${{ github.run_number }})"
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ integration_test/
      - run: flutter analyze --fatal-warnings
      - run: flutter test test/ --reporter expanded

  android:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh android
      - name: Derive version from tag
        id: version
        # 必须显式声明 bash：windows-latest 的默认 shell 是 pwsh，下面这段
        # 是 bash 语法（参数展开 ${VAR#v} / case / >> "$GITHUB_OUTPUT"），
        # 不声明的话 windows job 会用 pwsh 去跑它，第一次真正发版就炸。
        # actionlint 抓不到这个——它按 bash 校验脚本内容，不看 runner 默认 shell。
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3。flutter --build-name 只接受 x.y.z，带 v 前缀会被
          # 当成非法版本；tag 里可能有的 -beta 之类后缀也一并去掉。
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME%%-*}"
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$RELEASE_TAG' 推导不出合法版本号（需要 vX.Y.Z 形式）"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "推导版本: $NAME (build ${{ github.run_number }})"
      - run: flutter pub get
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # 缺签名必须直接失败，绝不静默降级成 debug 签名。
          # 降级会产出一个「构建成功」但实际无法上架、也无法后续升级
          # （签名 key 定了就不能换）的废包——比构建失败糟糕得多。
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置。release 构建不允许回退到 debug 签名："
            echo "::error::debug 签名的 AAB 无法上架 Google Play，且签名 key 无法事后更换。"
            echo "::error::请在仓库 Secrets 里配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /"
            echo "::error::ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD（生成步骤见 docs/RELEASE.md）。"
            exit 1
          fi
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build Android release (APK + AAB)
        env:
          DART_DEFINES: >-
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=GITHUB_REPO_SLUG=${{ vars.REPO_SLUG }}
            --dart-define=GITHUB_REPO_URL=${{ vars.REPO_URL }}
            --dart-define=TELEGRAM_CHANNEL_URL=${{ vars.TELEGRAM_CHANNEL_URL }}
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
            --dart-define=TERMS_AND_CONDITIONS_URL=${{ vars.TERMS_AND_CONDITIONS_URL }}
            --dart-define=GEOIP_CDN_URL=${{ vars.GEOIP_CDN_URL }}
            --dart-define=GEOSITE_CDN_URL=${{ vars.GEOSITE_CDN_URL }}
          # 产物版本必须来自 tag，不能用 pubspec 里那个写死的 0.1.0+1：
          #   - versionCode 恒为 1 → Play Store 第二次上传会被拒（要求严格递增）
          #   - App 里报的版本永远比 tag 旧 → 「检查更新」对所有用户永久误报
          #     有新版本（更新完还是提示，因为新包报的还是老版本号）
          # build-number 用 github.run_number：仓库级严格递增。
          VERSION_ARGS: >-
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
        run: |
          # shellcheck disable=SC2086  # 故意不加引号：DART_DEFINES 是一串空格
          # 分隔的 --dart-define=...，必须发生 word splitting 才能变成多个参数。
          # 加引号会把整串当成单个参数传给 flutter，构建直接失败。
          #
          # --split-per-abi：额外产出按 CPU 架构拆分的 APK。通用 APK 把四种
          # 架构的 native lib 全塞进去（150MB+），而任何一台手机只用得上其中
          # 一种。绝大多数用户下 arm64-v8a 就够了（~1/3 体积）。通用包保留，
          # 给不确定自己架构的用户兜底。
          flutter build apk --release --split-per-abi $VERSION_ARGS $DART_DEFINES
          # shellcheck disable=SC2086  # 同上
          flutter build apk --release $VERSION_ARGS $DART_DEFINES
      - name: Stage APKs with identifiable names
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # Flutter 产出的文件名是 app-release.apk / app-arm64-v8a-release.apk，
          # 用户下载下来完全认不出是什么应用、什么版本，而且下两个版本会撞名。
          APK_DIR=build/app/outputs/flutter-apk
          OUT=build/release
          mkdir -p "$OUT"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$APK_DIR/app-$abi-release.apk"
            test -s "$src" || { echo "::error::缺少 $src"; exit 1; }
            cp "$src" "$OUT/ClashMiao-Android-$abi-$VERSION.apk"
          done
          test -s "$APK_DIR/app-release.apk" || {
            echo "::error::缺少通用 APK"; exit 1; }
          cp "$APK_DIR/app-release.apk" \
            "$OUT/ClashMiao-Android-universal-$VERSION.apk"
          find "$OUT" -type f -name '*.apk' -printf '%f %s\n' | sort
      # APK 的上传**必须**排在 AAB 构建之前。AAB 只用于上传 Play Store，
      # 而 APK 是用户真正要下载的东西；AAB 那步挂掉不该把已经建好的四个 APK
      # 一起拖下水。这跟 publish 的 `if: always()` 是同一个道理，只是落在
      # step 层面：缺 AAB 时 run 仍然标红，但 release 里照样有 Android 包。
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/release/ClashMiao-Android-*.apk
          if-no-files-found: error
      - name: Build Android App Bundle (Play Store upload only)
        env:
          DART_DEFINES: >-
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=GITHUB_REPO_SLUG=${{ vars.REPO_SLUG }}
            --dart-define=GITHUB_REPO_URL=${{ vars.REPO_URL }}
            --dart-define=TELEGRAM_CHANNEL_URL=${{ vars.TELEGRAM_CHANNEL_URL }}
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
            --dart-define=TERMS_AND_CONDITIONS_URL=${{ vars.TERMS_AND_CONDITIONS_URL }}
            --dart-define=GEOIP_CDN_URL=${{ vars.GEOIP_CDN_URL }}
            --dart-define=GEOSITE_CDN_URL=${{ vars.GEOSITE_CDN_URL }}
          VERSION_ARGS: >-
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
        run: |
          # AAB 构建不了的**真正**原因在 android/app/build.gradle.kts：
          # splits.abi.isEnable 原来写死 true，ABI 拆分常开，AGP 就会为每个 ABI
          # 各生成一份 shrunk-resources，而 buildReleasePreBundle 只接受一份
          # （issuetracker.google.com/402800800）。已改成只在非 Bundle 任务时启用。
          #
          # 这里的 clean 不是修复手段——本地实测过，clean 之后单独建 AAB 照样
          # 失败，因为清掉的只是残留文件、拆分配置还在。它留在这里只是确定性
          # 兜底：APK 那趟（拆分开启）会在共享 intermediates 里留下四份 proto
          # shrunk-resources，实测 AGP 会自己清掉、不 clean 也能过，但那依赖它的
          # up-to-date 判定。发版不频繁，多花几分钟换一个从干净树构建出来的
          # 上架产物，划算。
          flutter clean
          flutter pub get
          # shellcheck disable=SC2086  # 同前：DART_DEFINES 必须发生 word splitting
          flutter build appbundle --release $VERSION_ARGS $DART_DEFINES
      - name: Stage AAB
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p build/store
          test -s build/app/outputs/bundle/release/app-release.aab || {
            echo "::error::缺少 AAB"; exit 1; }
          cp build/app/outputs/bundle/release/app-release.aab \
            "build/store/ClashMiao-Android-$VERSION.aab"
          find build/store -type f -name '*.aab' -printf '%f %s\n'
      - name: Upload AAB separately (Play Store upload only, not a public download)
        uses: actions/upload-artifact@v4
        with:
          name: store-android-aab
          path: build/store/ClashMiao-Android-*.aab
          if-no-files-found: error

  macos:
    runs-on: macos-15
    needs: [quality]
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (macos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh macos
      - name: Derive version from tag
        id: version
        # 必须显式声明 bash：windows-latest 的默认 shell 是 pwsh，下面这段
        # 是 bash 语法（参数展开 ${VAR#v} / case / >> "$GITHUB_OUTPUT"），
        # 不声明的话 windows job 会用 pwsh 去跑它，第一次真正发版就炸。
        # actionlint 抓不到这个——它按 bash 校验脚本内容，不看 runner 默认 shell。
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3。flutter --build-name 只接受 x.y.z，带 v 前缀会被
          # 当成非法版本；tag 里可能有的 -beta 之类后缀也一并去掉。
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME%%-*}"
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$RELEASE_TAG' 推导不出合法版本号（需要 vX.Y.Z 形式）"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "推导版本: $NAME (build ${{ github.run_number }})"
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - name: Build macOS release
        env:
          DART_DEFINES: >-
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=GITHUB_REPO_SLUG=${{ vars.REPO_SLUG }}
            --dart-define=GITHUB_REPO_URL=${{ vars.REPO_URL }}
            --dart-define=TELEGRAM_CHANNEL_URL=${{ vars.TELEGRAM_CHANNEL_URL }}
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
            --dart-define=TERMS_AND_CONDITIONS_URL=${{ vars.TERMS_AND_CONDITIONS_URL }}
            --dart-define=GEOIP_CDN_URL=${{ vars.GEOIP_CDN_URL }}
            --dart-define=GEOSITE_CDN_URL=${{ vars.GEOSITE_CDN_URL }}
          # 产物版本必须来自 tag，不能用 pubspec 里那个写死的 0.1.0+1：
          #   - versionCode 恒为 1 → Play Store 第二次上传会被拒（要求严格递增）
          #   - App 里报的版本永远比 tag 旧 → 「检查更新」对所有用户永久误报
          #     有新版本（更新完还是提示，因为新包报的还是老版本号）
          # build-number 用 github.run_number：仓库级严格递增。
          VERSION_ARGS: >-
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
        run: |
          # shellcheck disable=SC2086  # 同 android job：必须 word splitting
          flutter build macos --release --no-tree-shake-icons $VERSION_ARGS $DART_DEFINES
      - name: Verify macOS bundle (must be universal)
        run: |
          APP=build/macos/Build/Products/Release/clashmiao.app
          test -d "$APP"
          test -s "$APP/Contents/Frameworks/libcore.dylib"
          # 只出 arm64 的话 Intel Mac 装了也跑不起来（Rosetta 只能 x86→arm，
          # 反向不行）。可执行文件和 libcore 两者都必须含两个架构——校验而
          # 不是假设，产物名叫 universal 但实际是单架构才是最坑的情形。
          for BIN in "$APP/Contents/MacOS/clashmiao" "$APP/Contents/Frameworks/libcore.dylib"; do
            ARCHS="$(lipo -archs "$BIN")"
            echo "$BIN -> $ARCHS"
            case "$ARCHS" in
              *x86_64*arm64*|*arm64*x86_64*) ;;
              *) echo "::error::$BIN 不是 universal（实际: $ARCHS）"; exit 1 ;;
            esac
          done
      - name: Sign macOS app (skipped until Apple Developer account is configured)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # 没配置证书时不失败，只提示——签名依赖付费 Apple 开发者账号，
          # 账号到位前仍然要能出包（用户首次打开需右键→打开，见 docs/RELEASE.md）。
          if [ -z "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            echo "::warning::未配置 macOS 签名证书，产出的 dmg 未签名/未公证；用户首次打开会被 Gatekeeper 拦截，需右键→打开。"
            exit 0
          fi
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f cert.p12
          APP=build/macos/Build/Products/Release/clashmiao.app
          # 先签内嵌的 dylib，再签 App 本体——顺序反了外层签名会失效。
          find "$APP/Contents/Frameworks" -name '*.dylib' -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" {}
          codesign --force --deep --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create macOS packages
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          brew install create-dmg
          mkdir -p build/release
          # 文件名带版本号，跟其它三个平台一致：不带的话用户先后下两个版本会
          # 撞名，浏览器只能自动改成 "(1).dmg" 这种认不出来的名字。
          DMG="build/release/ClashMiao-macOS-universal-$VERSION.dmg"
          ZIP="build/release/ClashMiao-macOS-universal-$VERSION.zip"
          rm -f "$DMG" "$ZIP"
          create-dmg \
            --volname "ClashMiao" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            "$DMG" \
            "build/macos/Build/Products/Release/clashmiao.app" || \
          echo "::warning::dmg 创建失败；zip 产物仍会上传"
          ditto -c -k --keepParent \
            "build/macos/Build/Products/Release/clashmiao.app" "$ZIP"
          # dmg 和 zip 至少要有一个，两个都没有说明打包整体失败了
          test -s "$DMG" || test -s "$ZIP"
      - name: Notarize macOS dmg (skipped until Apple Developer account is configured)
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          # 必须跟打包步骤用同一个版本来源。用 ${RELEASE_TAG#v} 在 prerelease
          # tag 下会对不上：版本推导会把 v2.0.0-beta.1 归一成 2.0.0（Flutter 的
          # --build-name 不收 prerelease 段），文件名是 ...-2.0.0.dmg。
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$MACOS_NOTARY_APPLE_ID" ]; then
            echo "::warning::未配置公证凭据，dmg 未公证。"
            exit 0
          fi
          DMG="build/release/ClashMiao-macOS-universal-$VERSION.dmg"
          test -s "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait
          # staple 让用户离线也能通过 Gatekeeper 校验
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            build/release/ClashMiao-macOS-universal-*.dmg
            build/release/ClashMiao-macOS-universal-*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: [quality]
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Fetch libcore (windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bin/fetch-libcore.sh windows
      - name: Derive version from tag
        id: version
        # 必须显式声明 bash：windows-latest 的默认 shell 是 pwsh，下面这段
        # 是 bash 语法（参数展开 ${VAR#v} / case / >> "$GITHUB_OUTPUT"），
        # 不声明的话 windows job 会用 pwsh 去跑它，第一次真正发版就炸。
        # actionlint 抓不到这个——它按 bash 校验脚本内容，不看 runner 默认 shell。
        shell: bash
        run: |
          # v1.2.3 -> 1.2.3。flutter --build-name 只接受 x.y.z，带 v 前缀会被
          # 当成非法版本；tag 里可能有的 -beta 之类后缀也一并去掉。
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME%%-*}"
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$RELEASE_TAG' 推导不出合法版本号（需要 vX.Y.Z 形式）"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "推导版本: $NAME (build ${{ github.run_number }})"
      - run: flutter pub get
      - run: flutter config --enable-windows-desktop
      - name: Build Windows release
        env:
          DART_DEFINES: >-
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=GITHUB_REPO_SLUG=${{ vars.REPO_SLUG }}
            --dart-define=GITHUB_REPO_URL=${{ vars.REPO_URL }}
            --dart-define=TELEGRAM_CHANNEL_URL=${{ vars.TELEGRAM_CHANNEL_URL }}
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
            --dart-define=TERMS_AND_CONDITIONS_URL=${{ vars.TERMS_AND_CONDITIONS_URL }}
            --dart-define=GEOIP_CDN_URL=${{ vars.GEOIP_CDN_URL }}
            --dart-define=GEOSITE_CDN_URL=${{ vars.GEOSITE_CDN_URL }}
          # 产物版本必须来自 tag，不能用 pubspec 里那个写死的 0.1.0+1：
          #   - versionCode 恒为 1 → Play Store 第二次上传会被拒（要求严格递增）
          #   - App 里报的版本永远比 tag 旧 → 「检查更新」对所有用户永久误报
          #     有新版本（更新完还是提示，因为新包报的还是老版本号）
          # build-number 用 github.run_number：仓库级严格递增。
          VERSION_ARGS: >-
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
        shell: pwsh
        run: |
          # DART_DEFINES 是一个空格分隔的字符串（YAML 折叠标量），pwsh 不做
          # word splitting，必须显式拆成数组再 splat，否则会被当成单个参数。
          $defines = $env:DART_DEFINES -split '\s+' | Where-Object { $_ }
          $versionArgs = $env:VERSION_ARGS -split '\s+' | Where-Object { $_ }
          flutter build windows --release --no-tree-shake-icons @versionArgs @defines
      - name: Verify and stage Windows bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter clashmiao.exe |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path build/windows -Recurse | Select-Object FullName
            throw "clashmiao.exe was not produced"
          }
          $bundle = $exe.Directory.FullName
          $libcore = Join-Path $bundle "libcore.dll"
          if (!(Test-Path $libcore)) {
            Get-ChildItem -Path build/windows -Recurse -Filter libcore.dll | Select-Object FullName
            throw "libcore.dll is not bundled next to clashmiao.exe"
          }
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          "CLASHMIAO_BUNDLE_DIR=$bundle" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          # 版本号用 quality 那步推导出来的值，**不要**自己 TrimStart("v") 去啃
          # 原始 tag：那样 v0.0.1-rehearsal 会得到 "0.0.1-rehearsal"，而其余三个
          # 平台拿到的是剥掉 prerelease 后缀的 "0.0.1"。排练时真的产出过一个叫
          # ClashMiao-Windows-x64-0.0.1-rehearsal.zip 的包，只有 Windows 一家不一样。
          "CLASHMIAO_VERSION=${{ steps.version.outputs.name }}" |
            Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Sign Windows binaries (skipped until a code-signing cert is purchased)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # 当前不买证书。未签名的安装包会触发 SmartScreen「Windows 已保护
          # 你的电脑」，用户需点「更多信息」→「仍要运行」，下载页必须写清这步
          # （见 docs/RELEASE.md）。买了证书后配好这两个 Secret 即自动生效。
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            Write-Output "::warning::未配置 Windows 代码签名证书；安装包未签名，用户会遇到 SmartScreen 警告。"
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "$env:CLASHMIAO_BUNDLE_DIR\clashmiao.exe"
          Remove-Item cert.pfx
      # zip 必须在**签名之后**打。之前它排在签名步骤前面，等买了代码签名证书，
      # 安装器里的 exe 是签过的、zip 里的那份却没签——现在没证书所以两者都没签，
      # 看不出差别，一买证书就变成一个隐藏的不一致。
      - name: Create Windows zip
        shell: pwsh
        run: |
          # 打进一个带版本号的顶层目录，而不是把 44 个文件平铺在压缩包根下。
          # 用户通常直接在「下载」目录里解压，平铺会当场炸出一地文件，而且同时
          # 解两个版本会互相覆盖。Linux 的 tar.gz 早就用 --transform 做了这件事，
          # Windows 这边一直漏着。
          $version = "${env:CLASHMIAO_VERSION}"
          $stage = Join-Path "${env:RUNNER_TEMP}" "ClashMiao-$version"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path "${env:CLASHMIAO_BUNDLE_DIR}" '*') `
            -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage `
            -DestinationPath "build/release/ClashMiao-Windows-x64-$version.zip" -Force
          # 校验而不是假设：顶层必须只有那一个目录。
          $roots = [IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path "build/release/ClashMiao-Windows-x64-$version.zip")
          ).Entries.FullName | ForEach-Object { $_.Split('/')[0] } | Sort-Object -Unique
          if ($roots.Count -ne 1 -or $roots[0] -ne "ClashMiao-$version") {
            throw "zip 顶层结构不对：$($roots -join ', ')"
          }
          Write-Output "zip 顶层目录: $($roots[0])"
      - name: Create Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\packaging\inno\clashmiao.iss"
      - name: Stage Windows artifacts into one directory
        shell: pwsh
        run: |
          # 安装器和 zip 必须收进**同一个**目录再上传。upload-artifact 会保留所
          # 传路径的最近公共祖先：两个路径分别在 build/installer 和 build/release
          # 下时，公共祖先是 build/，于是 artifact 里带着 installer/ 和 release/
          # 两层子目录；而 macOS/Linux 的文件都在 build/release 下，落下来是平的。
          # 这个不一致让 Windows 的包在收集阶段被漏掉过一次——排练时 windows job
          # 明明成功，release 里却没有 Windows 包。
          Copy-Item "build\installer\ClashMiao-Windows-x64-${env:CLASHMIAO_VERSION}-Setup.exe" build\release\
          Get-ChildItem build\release\ClashMiao-Windows-x64-* | ForEach-Object {
            "{0}  {1} bytes" -f $_.Name, $_.Length
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/release/ClashMiao-Windows-x64-*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libayatana-appindicator3-dev libcurl4-openssl-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          NAME="${RELEASE_TAG#v}"
          NAME="${NAME%%-*}"
          case "$NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$RELEASE_TAG' 推导不出合法版本号（需要 vX.Y.Z 形式）"; exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Fetch libcore (linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/fetch-libcore.sh linux
      - run: flutter pub get
      - run: flutter config --enable-linux-desktop
      - name: Build Linux release
        env:
          DART_DEFINES: >-
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=GITHUB_REPO_SLUG=${{ vars.REPO_SLUG }}
            --dart-define=GITHUB_REPO_URL=${{ vars.REPO_URL }}
            --dart-define=TELEGRAM_CHANNEL_URL=${{ vars.TELEGRAM_CHANNEL_URL }}
            --dart-define=PRIVACY_POLICY_URL=${{ vars.PRIVACY_POLICY_URL }}
            --dart-define=TERMS_AND_CONDITIONS_URL=${{ vars.TERMS_AND_CONDITIONS_URL }}
            --dart-define=GEOIP_CDN_URL=${{ vars.GEOIP_CDN_URL }}
            --dart-define=GEOSITE_CDN_URL=${{ vars.GEOSITE_CDN_URL }}
          VERSION_ARGS: >-
            --build-name=${{ steps.version.outputs.name }}
            --build-number=${{ github.run_number }}
        run: |
          # shellcheck disable=SC2086  # 必须 word splitting，见 android job 说明
          flutter build linux --release $VERSION_ARGS $DART_DEFINES
      - name: Verify libcore.so bundled with FFI exports
        run: |
          BUNDLE=build/linux/x64/release/bundle
          test -f "$BUNDLE/lib/libcore.so" || {
            echo "::error::libcore.so 没被打进产物"; exit 1; }
          nm -D --defined-only "$BUNDLE/lib/libcore.so" |
            grep -E ' T (setup|start|stop|parse|selectOutbound|urlTest)$' >/dev/null || {
            echo "::error::libcore.so 缺少预期的 FFI 导出符号"; exit 1; }
      - name: Package Linux (tar.gz + deb)
        run: bin/package-linux.sh "${{ steps.version.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            build/release/ClashMiao-Linux-x86_64-*.tar.gz
            build/release/clashmiao_*_amd64.deb
          if-no-files-found: error


  publish:
    needs: [android, macos, windows, linux]
    # always()：某个平台缺签名密钥或构建失败时，**其余平台的包照样要发出去**。
    # 之前是硬 needs，结果 Android 缺 keystore 就一个包都不发、连桌面端都没有——
    # 用户打开 release 页面看到的是空的。缺哪个平台会在 release 正文里显式警告
    # （见 bin/make-release-notes.sh），整个 run 仍然标记为失败，不会掩盖问题。
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 不指定 ref：checkout 默认取 github.sha——tag push 时就是该 tag 指向的
      # commit，手动触发（排练）时就是分支头。写死 ref: RELEASE_TAG 的话，
      # 排练用的 tag 还不存在，checkout 直接失败，"排练"这条路根本走不通。
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        id: collect
        run: |
          # 暂存目录放在 $RUNNER_TEMP 下，**不能**放在 checkout 里：仓库自己有
          # 一个 assets/ 目录，之前写死 `assets` 就撞上了它，把 17 个字体/图片
          # 文件当成了发布产物（详见 bin/collect-release-assets.sh 的注释）。
          COUNT="$(bin/collect-release-assets.sh artifacts "$RUNNER_TEMP/release-assets")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Generate SHA256SUMS
        run: |
          # 让用户能校验下载完整性——开源项目标配。
          # 在暂存目录里跑并只输出文件名（不带路径）：sha256sum 的输出里带路径
          # 的话，用户在自己的下载目录里跑 `sha256sum -c` 会找不到文件。
          cd "$RUNNER_TEMP/release-assets"
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' |
            sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build release notes
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          bin/make-release-notes.sh "${VERSION#v}" \
            "$RUNNER_TEMP/release-assets" > notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 已存在就更新（重跑同一个 tag 时不该失败），不存在就创建。
          # tag push 触发时 inputs.draft 为空 → DRAFT_FLAG 为空 → 正式发布。
          # 只有手动触发且勾了 draft 才发成草稿。
          DRAFT_FLAG=""
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
            echo "::notice::发成 draft（只有协作者可见）。确认无误后在 Releases 页面点 Publish，或直接删掉。"
          fi
          # 显式列出要上传的文件，而不是把 `<dir>/*` 交给 gh：glob 里混进一个
          # 目录，gh 会报 "read <dir>: is a directory" 而整条失败。收集脚本已
          # 保证暂存目录里只有文件，这里再用 -type f 兜一层。
          mapfile -t ASSET_FILES < <(
            find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f | sort
          )
          [ ${#ASSET_FILES[@]} -gt 0 ] || { echo "::error::暂存目录里没有文件"; exit 1; }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" "${ASSET_FILES[@]}" --clobber
          else
            # shellcheck disable=SC2086  # DRAFT_FLAG 要么是空要么是单个 --draft，
            # 必须不加引号，否则空值会被当成一个空参数传给 gh
            gh release create "$RELEASE_TAG" $DRAFT_FLAG \
              --title "ClashMiao ${RELEASE_TAG#v}" \
              --notes-file notes.md \
              "${ASSET_FILES[@]}"
          fi
          echo "已发布：$(gh release view "$RELEASE_TAG" --json url --jq .url)"

  report:
    needs: [quality, android, macos, windows, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release-status branch
        run: |
          git fetch origin release-status || true
          if git show-ref --verify --quiet refs/remotes/origin/release-status; then
            git checkout -B release-status origin/release-status
          else
            git checkout --orphan release-status
            git rm -rf . >/dev/null 2>&1 || true
          fi
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Write release status
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = []
          root = Path("artifacts")
          if root.exists():
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  artifacts.append({
                      "path": path.as_posix(),
                      "size": path.stat().st_size,
                  })

          report = {
              "tag": os.environ["RELEASE_TAG"],
              "sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "jobs": {
                  "quality": os.environ["QUALITY_RESULT"],
                  "android": os.environ["ANDROID_RESULT"],
                  "macos": os.environ["MACOS_RESULT"],
                  "windows": os.environ["WINDOWS_RESULT"],
                  "publish": os.environ["PUBLISH_RESULT"],
              },
              "artifacts": artifacts,
          }

          out_dir = Path(".release-status")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / f"{os.environ['RELEASE_TAG']}.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Push release status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".release-status/${RELEASE_TAG}.json"
          git commit -m "Record release status ${RELEASE_TAG}" || true
          git push origin release-status
