org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 把 ABI 过滤的控制权从 Flutter 手里拿回来。
#
# 不设这个的话，Flutter 的 gradle 插件在 configureAbiWithoutSplits 里会
# `abiFilters.clear()` 再塞回它自己的全量列表（arm64-v8a / armeabi-v7a /
# x86_64），app/build.gradle.kts 里写的 abiFilters 被整个抹掉——它源码里的注释
# 声称"用户自己配的优先"，但代码是无条件覆盖的。
#
# 症状很隐蔽：--target-platform android-arm64 只管住了 Flutter 自己的
# libapp.so / libflutter.so，第三方 AAR 带来的 libbox.so（40MB+/架构）、
# libsentry.so 等仍然三份都打进去。实测 219MB → 176MB，看着"变小了"，其实
# 32 位和 x86_64 的原生库一个没少。
android.disable-abi-filtering=true
disable-abi-filtering=true
