name: clashmiao
description: "喵速 - 跨平台代理客户端"
publish_to: "none"
# 这个值**只影响本地/调试构建**，不决定发版版本号。
#
# 正式产物的版本从 git tag 推导，由 .github/workflows/release.yml 通过
# `--build-name`（tag 去掉 v 前缀）和 `--build-number`（github.run_number）
# 传给 flutter build，会覆盖这里。所以看到"tag 是 v0.1.1、这里却是 0.1.0"
# 不是 bug，不需要在发版时同步改这一行。
#
# 调试包上看到的旧版本号同理——那是这个值，不是用户拿到的版本。
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3

  # 路由
  go_router: ^18.1.0

  # 网络
  dio: ^5.5.0

  # 集合扩展（firstWhereOrNull 等）
  collection: ^1.19.0

  # 响应式
  rxdart: ^0.28.0

  # 本地存储
  shared_preferences: ^2.2.3

  # FFI
  ffi: ^2.1.2

  # 文件路径
  path_provider: ^2.1.3
  path: any

  # UI 组件
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  gap: ^3.0.1
  fluentui_system_icons: ^1.1.245

  # 工具类
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  loggy: ^2.0.3
  meta: any

  # 深链（sing-box:// clash:// clashmeta:// clashmiao:// 导入订阅）
  app_links: ^6.3.2

  # 桌面端
  window_manager: ^0.3.9
  tray_manager: ^0.2.2
  # Windows 开机自启（HKCU\...\Run 注册表，见 core/auto_start/windows_run_key.dart）
  win32_registry: ^3.0.3

  # 二维码
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # 通知
  toastification: ^2.1.0
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  intl: ^0.20.2

  # 监控、分享、文件、权限、加密
  sentry_flutter: ^9.0.0
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  permission_handler: ^11.3.0
  crypto: ^3.0.3

  # 首连成功后请求 App Store / Play Store 内置评分弹窗
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  pigeon: ^29.0.11
  analyzer: ^14.5.0
  fake_async: ^1.3.3
  # 仅测试用：box_providers_groups_test 要实现 Riverpod 的调度接口来模拟「后台没有帧」
  riverpod: ^3.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/rule-sets/

  fonts:
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf
