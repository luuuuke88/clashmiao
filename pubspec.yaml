name: clashmiao
description: "喵速 - 跨平台代理客户端"
publish_to: "none"
# 这个值**只影响本地/调试构建**，不决定发版版本号。
#
# 正式产物的版本从 git tag 推导，由 .github/workflows/release.yml 通过
# `--build-name`（tag 去掉 v 前缀）和 `--build-number`（github.run_number）
# 传给 flutter build，会覆盖这里。所以看到"tag 是 v0.1.1、这里却是 0.1.0"
# 不是 bug，不需要在发版时同步改这一行。
#
# 调试包上看到的旧版本号同理——那是这个值，不是用户拿到的版本。
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  hooks_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.0

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.5.0

  # 函数式编程
  fpdart: ^1.1.0

  # 集合扩展（firstWhereOrNull 等）
  collection: ^1.19.0

  # 响应式
  rxdart: ^0.28.0

  # 数据序列化
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 本地存储
  shared_preferences: ^2.2.3

  # FFI
  ffi: ^2.1.2

  # 文件路径
  path_provider: ^2.1.3
  path: any

  # UI 组件
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  gap: ^3.0.1
  percent_indicator: ^4.2.3
  fluentui_system_icons: ^1.1.245

  # 工具类
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  loggy: ^2.0.3
  meta: any

  # 深链（sing-box:// clash:// clashmeta:// clashmiao:// 导入订阅）
  app_links: ^6.3.2

  # 桌面端
  window_manager: ^0.3.9
  tray_manager: ^0.2.2

  # 二维码
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0

  # 通知
  toastification: ^2.1.0
  slang: ^3.32.0
  slang_flutter: ^3.32.0
  intl: ^0.20.2
  launch_at_startup: ^0.5.1

  # 监控、分享、文件、权限、图表、加密
  sentry_flutter: ^9.0.0
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.0
  fl_chart: ^0.69.0
  crypto: ^3.0.3

  # 首连成功后请求 App Store / Play Store 内置评分弹窗
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  go_router_builder: ^2.7.0
  slang_build_runner: ^3.32.0
  pigeon: ^26.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/rule-sets/

  fonts:
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf
